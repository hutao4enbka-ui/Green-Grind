body::after{content:"";position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,rgba(15,106,38,.35),rgba(5,37,13,.92) 70%);z-index:-1}
.wrap{max-width:960px;margin:0 auto;padding:22px 20px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;letter-spacing:.2px;color:var(--lime)}
.logo svg{width:28px;height:28px}
.live{display:none;align-items:center;gap:8px;font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--card)}
.live.on{display:inline-flex}
.live b{color:var(--text);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,226,92,.7);animation:p 1.8s infinite;flex:none}
@keyframes p{70%{box-shadow:0 0 0 9px rgba(52,226,92,0)}100%{box-shadow:0 0 0 0 rgba(52,226,92,0)}}
.hero{margin:54px 0 30px}
.eyebrow{color:var(--lime);font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:clamp(32px,6.5vw,56px);line-height:1.08;margin:12px 0 14px;font-weight:600;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,#c9ff9e,#34e25c);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);max-width:520px;line-height:1.6;margin:0;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0 22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;backdrop-filter:blur(8px)}
.stat b{display:block;font-size:30px;font-weight:600;line-height:1}
.stat small{color:var(--mute);font-size:13px}
.stat.hi b{color:var(--lime)}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{font:inherit;font-size:14px;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer;transition:.2s}
.tab.on{background:var(--lime);color:#06290f;border-color:var(--lime);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:6px;transition:transform .2s,border-color .2s}
.card.open{border-color:rgba(155,255,107,.65);background:linear-gradient(160deg,rgba(155,255,107,.16),rgba(255,255,255,.06));box-shadow:0 10px 40px -12px rgba(52,226,92,.45)}
.card.open:hover{transform:translateY(-3px)}
.top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.open .st{color:var(--lime)}
.closed .st{color:var(--off)}
.closed{opacity:.62}
.closed .dot{background:var(--off);animation:none}
.num{margin-left:auto;color:var(--mute);font-weight:400}
h3{margin:10px 0 0;font-size:22px;font-weight:600}
.meta{margin:0;color:var(--mute);font-size:13px}
.chips{display:flex;gap:8px;margin:12px 0 6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--text)}
.btn{margin-top:auto;padding-top:0;display:block;text-align:center;text-decoration:none;font-size:14px;font-weight:600;border-radius:14px;padding:12px;margin-top:14px}
a.btn{background:var(--lime);color:#06290f;transition:.2s}
a.btn:hover{background:#c9ff9e}
.btn.off{border:1px dashed var(--line);color:var(--off);font-weight:500}
.msg{grid-column:1/-1;color:var(--mute);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:18px}
footer{margin-top:44px;color:var(--mute);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:520px){.stats{gap:8px}.stat{padding:13px}.stat b{font-size:24px}.hero{margin-top:36px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none" stroke="#9bff6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 28V16"/><path d="M16 17C16 11 11 8 5 8c0 6 4 9 11 9z"/><path d="M16 14c0-5 4-8 11-8 0 6-4 9-11 8z"/></svg>
      Green Grind
    </div>
    <div class="live" id="live"><span class="dot"></span><span>На сайте: <b id="viewers">1</b></span></div>
  </header>

  <section class="hero">
    <div class="eyebrow">Tower of Hell · Roblox</div>
    <h1>Серверы <span>Green Grind</span></h1>
    <p class="sub">Следи за статусом серверов: какие сейчас открыты, а какие закрыты. Список обновляется автоматически.</p>
  </section>

  <section class="stats">
    <div class="stat hi"><b id="cOpen">0</b><small>Открыто</small></div>
    <div class="stat"><b id="cClosed">0</b><small>Закрыто</small></div>
    <div class="stat"><b id="cAll">0</b><small>Всего серверов</small></div>
  </section>

  <div class="tabs" id="tabs">
    <button class="tab on" data-f="all">Все</button>
    <button class="tab" data-f="open">Открытые</button>
    <button class="tab" data-f="closed">Закрытые</button>
  </div>

  <main class="grid" id="grid"></main>

  <footer><span>Green Grind · Tower of Hell</span><span id="upd">Обновляется автоматически</span></footer>
</div>

<script>
// Статусы серверов берутся из Google Таблицы (колонки: Сервер, Статус, Ссылка, Игроков).
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCE3zYCxH3vBzSHInVvB5Ev_EiqJl4DnJ8csIikKRmUVydbTNIHS4a3BXFJY5VA_AToayo81QEjJ8E/pub?gid=505888007&single=true&output=csv";
const GAME_URL = "https://www.roblox.com/games/1962086868/Tower-of-Hell";
const REFRESH_MS = 60000;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let SERVERS = null, filter = "all", failed = false;

function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r"){
      if (ch === "\r" && text[i+1] === "\n") i++;
      row.push(cur); rows.push(row); row = []; cur = "";
    } else cur += ch;
  }
  if (cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

function toServers(rows){
  return rows.slice(1).filter(r => (r[0] || "").trim()).map((r, i) => {
    const link = (r[2] || "").trim();
    const pl = parseInt((r[3] || "").trim(), 10);
    return {
      id: i + 1,
      name: r[0].trim(),
      open: /^(откр|open|да|yes|1|true|вкл)/i.test((r[1] || "").trim()),
      link: /^https?:\/\//i.test(link) ? link : GAME_URL,
      players: Number.isNaN(pl) ? null : pl
    };
  });
}

function render(){
  const g = $("grid");
  if (SERVERS === null){
    ["cOpen","cClosed","cAll"].forEach(id => $(id).textContent = "–");
    g.innerHTML = `<div class="msg">${failed ? "Не получилось загрузить статусы серверов. Обновите страницу чуть позже." : "Загружаем статусы…"}</div>`;
    return;
  }
  const o = SERVERS.filter(s => s.open).length;
  $("cOpen").textContent = o;
  $("cClosed").textContent = SERVERS.length - o;
  $("cAll").textContent = SERVERS.length;
  const list = SERVERS.filter(s => filter === "all" || (filter === "open") === s.open);
  if (!list.length){ g.innerHTML = `<div class="msg">Здесь пока пусто</div>`; return; }
  g.innerHTML = list.map(s => `
    <article class="card ${s.open ? "open" : "closed"}">
      <div class="top"><span class="dot"></span><span class="st">${s.open ? "Открыт" : "Закрыт"}</span><span class="num">#${s.id}</span></div>
      <h3>${esc(s.name)}</h3>
      <p class="meta">Tower of Hell · Roblox</p>
      ${s.open && s.players !== null ? `<div class="chips"><span class="chip">Игроков: ${s.players}</span></div>` : ""}
      ${s.open ? `<a class="btn" href="${esc(s.link)}" target="_blank" rel="noopener">Открыть в Roblox</a>` : `<span class="btn off">Сейчас закрыт</span>`}
    </article>`).join("");
}

async function load(){
  try {
    const r = await fetch(SHEET_URL + "&t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    SERVERS = toServers(parseCSV(await r.text()));
    failed = false;
    $("upd").textContent = "Обновлено: " + new Date().toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"});
  } catch (e) { if (SERVERS === null) failed = true; }
  render();
}

$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === b));
  render();
});
render();
load();
setInterval(load, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

// Онлайн на сайте (кто сейчас смотрит страницу) работает только внутри Claude
(async () => {
  try {
    const room = await claude.use("room");
    if (!room) return;
    room.presence({here: true});
    room.onPeers(ch => {
      $("viewers").textContent = Math.max(1, ch.peers.length);
      $("live").classList.add("on");
    });
  } catch (e) { /* на обычном хостинге это не нужно */ }
})();
</script>
</body>
</html>
